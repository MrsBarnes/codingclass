
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점심에 김치찌개 먹음</title>
</head>
    <style>
         body{
            margin:0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family:"Segoe UI", "Noto Sans KR", sans-serif;
            background: #f7f8fb;
            color:#1b1f23;
        }
        .practice{
            width:min(680px, clac(100% - 32px));
            padding: 24px;
            border: 1px solid #d8de99;
            border-radius: 12px;
            background:white;
        }
        button, input {font:inherit}
        label{
            display:grid;
            gap: 6px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        input{
            padding:10px;
            border:1px solid #cbd5e1;
            border-radius: 8px;
        }
    </style>
<body>
    <main class="practice">
        <label>이메일<input type="email" placeholder="name@example.com" id="email"></label>
        <label>날짜<input  id="date" type="date"></label>
        <label>만족도<input  type="range" min="0" max="100" id="range"></label>
        <label>검색<input type="search"  placeholder="검색어" id="search"></label>
    </main>
    <script>
        const emailInput = document.getElementById('email');
        const dateInput = document.getElementById('date');
        const rangeInput = document.getElementById('range');
        const searchInput = document.getElementById('search');

        emailInput.addEventListener('keydown',function(event){
            if(event.key === 'Enter' && emailInput.value.trim() !== ''){
                alert('이메일 : '+ emailInput.value);
            }
        });

        dateInput.addEventListener('keydown',function(event){
            if(event.key === 'Enter' && dateInput.value.trim() !== ''){
                alert('날짜 : '+ dateInput.value);
            }
        });

        rangeInput.addEventListener('keydown',function(event){
            if(event.key === 'Enter' && rangeInput.value.trim() !== ''){
                alert('만족도 : '+ rangeInput.value);
            }
        });

        searchInput.addEventListener('keydown',function(event){
            if(event.key === 'Enter' && searchInput.value.trim() !== ''){
                alert('검색어 : '+ searchInput.value);
            }
        });
