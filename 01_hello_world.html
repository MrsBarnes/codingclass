<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱 구조 실습</title>
    <style>
        body{
            margin:0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family:
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
            background: #f7f8fb;
            color:#1b1f23;
        }
        .practice{
            width:min(680px, clac(100% - 32px));
            padding: 24px;
            border: 1px solid #d8de99;
            border-radius: 12px;
            background:white;
        }
        button, input {font:inherit}
        .site-head, .menu, article, aside, .foot{
            padding: 14px;
            border-radius: 10px;
        } 
        .site-head{
            background: #1f2937;
            color:white;
        }
        .menu{
            margin:10px 0;
            background: #e0e7ff;
        }
        .layout{
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 10px;
        }
        article{
            background:#f8fafc;
            border:1px solid #e5e7eb;
        }
        aside{
            background: #ecfdf5;
        }
        .foot{
            margin-top: 10px;
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <main class="practice">
        <header class="site-head">오늘의 웹수업</header>
        <nav class="menu">HTML | CSS | JavaScript</nav>
        <section class="layout">
            <article>
                <h3>본문 카드</h3>
                <p>문서의 핵심 내용은 article 안에 배치합니다.</p>
            </article>
            <aside>보조 정보</aside>
        </section>
        <footer class="foot">수업 자료 정리</footer>
    </main>
</body>
</html>
